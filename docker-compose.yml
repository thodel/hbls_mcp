services:
  hbls-mcp:
    build: .
    image: hbls-mcp:latest
    container_name: hbls-mcp
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - /home/dh/hbls_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - HBLS_DB=/data/hbls.db
      - HBLS_HOST=0.0.0.0
      - HBLS_PORT=8003
      # The server answers on its *public* path so nginx can proxy_pass without
      # rewriting. Change this together with the nginx location block; the two
      # must agree exactly or every request 404s.
      - HBLS_HTTP_PATH=${HBLS_HTTP_PATH:-/mcp/hbls/mcp}
      # Semantic search. The key embeds the incoming query only — the
      # passage vectors are already in hbls.db.
      - GPUSTACK_BASE_URL=${GPUSTACK_BASE_URL:-https://gpustack.unibe.ch/v1}
      - GPUSTACK_API_KEY=${GPUSTACK_API_KEY:-}
      - HBLS_EMBED_MODEL=${HBLS_EMBED_MODEL:-qwen3-embedding-0.6b}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('localhost', 8003), 3).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
